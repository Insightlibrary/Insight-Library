<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Forgot Password</title>  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 400px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
    }

    p {
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }

  </style></head><body>  <div class="container"><h1>Forgot Password?</h1>

<p>
  Enter your email address and we will send you
  instructions to reset your password.
</p>


<form id="forgotPasswordForm">

  <input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
  >


  <button type="submit">
    Send Reset Link
  </button>

</form>


<p id="message"></p>


<p>
  <a href="login.html">
    Back to Login
  </a>
</p>

  </div><script>

  const forgotPasswordForm =
    document.getElementById("forgotPasswordForm");

  const message =
    document.getElementById("message");


  forgotPasswordForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const email =
        document.getElementById("email").value;


      message.textContent =
        "Sending reset link...";


      try {

        const response = await fetch(
          "https://insight-library.onrender.com/api/v1/auth/forgot-password",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email
            })
          }
        );


        const data =
          await response.json();


        if (!response.ok) {

          message.textContent =
            data.message ||
            "Unable to send reset link.";

          return;
        }


        message.textContent =
          data.message ||
          "If an account exists with that email, a reset link has been sent.";

      } catch (error) {

        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";

      }

    }
  );

</script></body></html>
