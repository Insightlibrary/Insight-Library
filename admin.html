<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Upload Content</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
    }

    button {
      cursor: pointer;
      background: #222;
      color: white;
      border: none;
      border-radius: 5px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Upload Content</h1>

    <form id="uploadForm">

      <input
        type="text"
        id="title"
        placeholder="Content title"
        required
      >

      <textarea
        id="description"
        placeholder="Content description"
        required
      ></textarea>

      <input
        type="number"
        id="price"
        placeholder="Price in Naira"
        min="0"
        required
      >

      <input
        type="file"
        id="file"
        accept="application/pdf"
        required
      >

      <button type="submit">
        Upload Content
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>

    const uploadForm = document.getElementById("uploadForm");
    const message = document.getElementById("message");

    uploadForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const token = localStorage.getItem("token");

      if (!token) {
        message.textContent = "Please login first.";
        return;
      }

      const formData = new FormData();

      formData.append(
        "title",
        document.getElementById("title").value
      );

      formData.append(
        "description",
        document.getElementById("description").value
      );

      formData.append(
        "price",
        document.getElementById("price").value
      );

      formData.append(
        "file",
        document.getElementById("file").files[0]
      );

      message.textContent = "Uploading...";

      try {
        
          const response = await fetch(
  "https://insight-library.onrender.com/api/admin/content/upload",
          {
            method: "POST",

            headers: {
              "Authorization": `Bearer ${token}`
            },

            body: formData
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || data.error || "Upload failed"
          );
        }

        message.textContent =
          "Content uploaded successfully!";

        uploadForm.reset();

        console.log(data);

      } catch (error) {

        console.error(error);

        message.textContent =
          "Upload failed: " + error.message;
      }

    });

  </script>

</body>
</html>
