<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Upload Content</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
    }

    button {
      cursor: pointer;
      background: #222;
      color: white;
      border: none;
      border-radius: 5px;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Upload Content</h1>

    <form id="uploadForm">

      <input
        type="text"
        id="title"
        placeholder="Content title"
        required
      >

      <textarea
        id="description"
        placeholder="Content description"
        required
      ></textarea>

      <input
        type="number"
        id="price"
        placeholder="Price in Naira"
        min="0"
        required
      >

      <input
        type="file"
        id="file"
        accept="application/pdf"
        required
      >

      <button type="submit">
        Upload Content
      </button>

    </form>
    <hr>

<p>
  <strong>One-time migration:</strong>
  Use this only to assign existing unowned content to the Super Admin.
</p>

<button id="migrateContentButton">
  Assign Existing Content to Super Admin
</button>

<p id="migrationMessage"></p>

    <div id="message"></div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
