<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .login-container {
      width: 90%;
      max-width: 400px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }

  </style>

</head>


<body>

  <div class="login-container">

    <h1>Login</h1>


    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          required
        >

      </div>


      <button type="submit">
        Login
      </button>

    </form>


    <p id="message"></p>


    <p>

      Don't have an account?

      <a href="register.html">
        Create Account
      </a>

    </p>

  </div>


<script>

  const loginForm = document.getElementById("loginForm");

  const message = document.getElementById("message");


  loginForm.addEventListener("submit", async (event) => {

    // Stop the browser from refreshing the page
    event.preventDefault();


    // Get what the customer typed
    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;


    try {

      // Send login information to our backend
      const response = await fetch(
        "https://insight-library.onrender.com/api/v1/auth/login",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


      // Convert backend response into JavaScript
      const data = await response.json();


      // Check if login failed
      if (!response.ok) {

        message.textContent =
          data.message || "Login failed.";

        return;
      }


      // Save the JWT token in the customer's browser
      localStorage.setItem(
        "token",
        data.token
      );


    message.textContent =
  "Login successful!";


setTimeout(() => {

  const pendingContentId =
    localStorage.getItem("pendingContentId");


  if (pendingContentId) {

    localStorage.removeItem("pendingContentId");

    window.location.href =
      `index.html?buy=${pendingContentId}`;

  } else {

    window.location.href =
      "index.html";

  }

}, 1000);

    } catch (error) {

      console.error(error);

      message.textContent =
        "Something went wrong. Please try again.";

    }

  });

</script>
</body>

</html>
