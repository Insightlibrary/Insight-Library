<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .register-container {
      width: 90%;
      max-width: 400px;
      margin: 50px auto;
    }

    h1 {
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="register-container">

    <h1>Create Account</h1>

    <form id="registerForm">

      <div class="form-group">
        <label for="name">Name</label>

        <input
          type="text"
          id="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          required
        >
      </div>

      <button type="submit">
        Create Account
      </button>

    </form>

    <p id="message"></p>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>


<script>

  const registerForm = document.getElementById("registerForm");

  const message = document.getElementById("message");


  registerForm.addEventListener("submit", async (event) => {

    // Stop the browser from refreshing the page
    event.preventDefault();


    // Get the values typed by the customer
    const name = document.getElementById("name").value;

    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;


    try {

      // Send the information to our backend
      const response = await fetch(
        "https://insight-library.onrender.com/api/v1/auth/register",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            name: name,
            email: email,
            password: password
          })
        }
      );


      // Convert backend response into JavaScript object
      const data = await response.json();


      // If registration failed
      if (!response.ok) {

        message.textContent =
          data.message || "Registration failed.";

        return;
      }


      // Registration succeeded
      message.textContent =
        "Account created successfully!";


      // Wait a little, then go to login page
      setTimeout(() => {

        window.location.href = "login.html";

      }, 1500);


    } catch (error) {

      console.error(error);

      message.textContent =
        "Something went wrong. Please try again.";

    }

  });

</script>
</body>

</html>
